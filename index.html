<style>

  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#141821}
  canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
  #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(12,16,24,.5);padding:16px;box-sizing:border-box;overflow:auto}
  #ui[hidden]{display:none}
  .panel{width:100%;max-width:540px;background:#1b2130;border:2px solid #c9a45c;border-radius:6px;margin:auto;
    box-shadow:0 0 0 4px #10141d,0 18px 40px rgba(0,0,0,.5);padding:22px 22px 18px;box-sizing:border-box}
  .eyebrow{font-size:12px;letter-spacing:.14em;color:#c9a45c;font-weight:700}
  .panel h1{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:48px;line-height:1.05;
    margin:6px 0 10px;color:#fff;text-shadow:3px 3px 0 #1f2230,-2px -2px 0 #1f2230,2px -2px 0 #1f2230,-2px 2px 0 #1f2230;text-wrap:balance}

  .label{font-size:11px;letter-spacing:.12em;color:#8f9ab2;font-weight:700;margin:0 0 6px}
  .keys{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px;padding:0;list-style:none;font-size:13px}
  .keys li{display:flex;align-items:center;gap:8px;background:#232b3d;border:1px solid #2f3a52;border-radius:4px;padding:6px 9px}
  .keys li.wide{grid-column:1/-1}
  kbd{font-family:"Black Han Sans",sans-serif;font-size:13px;min-width:24px;text-align:center;padding:2px 6px;
    background:#c9a45c;color:#1b2130;border-radius:3px;box-shadow:0 2px 0 #7d6331}
  .classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:0 0 12px}
  .cls{font-family:"Noto Sans KR",sans-serif;text-align:left;background:#232b3d;border:2px solid #2f3a52;border-radius:5px;color:#e9ecf3;
    padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.45}
  .cls b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:22px;color:#fff}
  .cls span{color:#9aa4ba}
  .cls[aria-pressed="true"]{border-color:#e0aa3e;background:#33304a}
  .cls:focus-visible{outline:3px solid #fff;outline-offset:1px}
  .stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:0 0 12px}

  .st[aria-pressed="true"]{border-color:#e0aa3e;background:#33304a}

  .st:disabled b{color:#7f8aa3}
  .st:focus-visible{outline:3px solid #fff;outline-offset:1px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}

(() => {
const W = 1280, H = 720;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const ui = document.getElementById('ui'), panel = document.getElementById('panel');
let scale = 1, dpr = Math.min(window.devicePixelRatio || 1, 2);

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Array.isArray(r) ? r[0] : r; r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();

// ---------- utils ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
const FONT = '"Black Han Sans","Noto Sans KR",sans-serif';
const PI = Math.PI;
const now = () => performance.now() / 1000;

const OL = '#1f2230';
let curOL = OL;
const LW = 3;
function P(fill, lw = LW) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = curOL; ctx.stroke(); }
function limb(pts, w, col) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.strokeStyle = curOL; ctx.lineWidth = w + LW * 2; ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, PI * 2); }
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); }
function outlinedText(txt, x, y, size, fill, ol = OL, lw = 6, align = 'center') {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; if (lw > 0) { ctx.lineWidth = lw; ctx.strokeStyle = ol; ctx.strokeText(txt, x, y); }
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}

// ---------- audio ----------
let AC = null, muted = false, noiseBuf = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function noise(dur, freq, gain, q = 1) {
  const t = AC.currentTime, s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur);
}
function tone(f1, f2, dur, gain, type = 'sine') {
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
}
function sfx(k) {
  if (!AC || muted) return;
  try {
    if (k === 'swing') noise(0.12, 3000, 0.12, 0.8);
    else if (k === 'hit') { tone(200, 60, 0.12, 0.25); noise(0.07, 1200, 0.2); }
    else if (k === 'crit') { tone(320, 80, 0.16, 0.3, 'triangle'); noise(0.1, 1800, 0.25); }
    else if (k === 'hurt') { tone(160, 70, 0.2, 0.25, 'square'); }
    else if (k === 'skill') { noise(0.3, 900, 0.18, 0.6); tone(300, 900, 0.25, 0.08, 'sawtooth'); }
    else if (k === 'boom') { tone(120, 30, 0.5, 0.4); noise(0.4, 400, 0.35, 0.5); }
    else if (k === 'shot') { tone(900, 300, 0.12, 0.07, 'square'); }
    else if (k === 'zap') { noise(0.18, 4000, 0.2, 2); tone(1400, 200, 0.15, 0.08, 'sawtooth'); }
    else if (k === 'magic') { tone(500, 1200, 0.15, 0.08, 'triangle'); }
    else if (k === 'warn') { tone(440, 440, 0.25, 0.08, 'square'); }
    else if (k === 'pick') { tone(600, 1200, 0.15, 0.12, 'triangle'); }
    else if (k === 'lvl') { tone(440, 880, 0.3, 0.12, 'triangle'); setTimeout(() => tone(660, 1320, 0.3, 0.1, 'triangle'), 120); }
  } catch (e) {}
}

  if (!s || !s.sword) {

    try { const o = JSON.parse(localStorage.getItem('grassSwordsman.v2')); if (o && typeof o.unlocked === 'number') s.sword = o; } catch (e) {}

  if (!s.mage) s.mage = blankSave();

  if (!s.cls) s.cls = 'sword';

}

  if (zi < 2) {
    const n = 4 + si + zi;
    for (let i = 0; i < n; i++) {

      add(mob(), wave2 ? x0 + 250 + R() * 900 : x0 + 650 + R() * 780, lane(), wave2 ? 3 + i * 0.25 : i * 0.2);
    }
    if (S.shooter) { const ns = zi + (si >= 4 ? 1 : 0); for (let i = 0; i < ns; i++) add(S.shooter, x0 + 1250 + R() * 180, lane(), 0.5 + i * 1.2); }
  } else {
    add(S.boss, x0 + 950, 548, 0.6);
    const n = MOBS[S.boss].ai ? 1 + Math.floor(si / 3) : 2 + Math.floor(si / 2);
    for (let i = 0; i < n; i++) add(mob(), x0 + 600 + R() * 800, lane(), i * 0.2);

  sv.unlocked = Math.max(sv.unlocked, Math.min(si + 1, STAGES.length - 1)); sv.lvl = hero.lvl; sv.exp = hero.exp; save.cls = cls; writeSave(save);
  const hurtRatio = G.dmgTaken / hero.maxHp;
  let score = 0; if (G.time < 150) score++; if (G.time < 240) score++; if (hurtRatio < 0.5) score++; if (hurtRatio < 1.2) score++; if (G.maxCombo >= 40) score++;
  const rank = score >= 5 ? 'SSS' : score >= 4 ? 'S' : score >= 3 ? 'A' : score >= 2 ? 'B' : 'C';
  const next = last ? null : STAGES[si + 1];
  panel.innerHTML = `
    <div class="eyebrow">${last ? 'ALL STAGES CLEAR' : `STAGE ${si + 1} CLEAR`} · ${STAGES[si].name}</div>
    <div style="display:flex;align-items:center;gap:16px;margin:8px 0 12px"><div class="rank">${rank}</div>
    <h1 style="margin:0;font-size:36px">${last ? '공허의 끝에 도달했습니다' : `${MOBS[STAGES[si].boss].name} 격파`}</h1></div>
    ${last ? '<p>초원에서 시작한 여정이 공허의 끝에서 막을 내렸습니다. 이제 모든 스테이지를 자유롭게 다시 도전할 수 있어요.</p>' : `<p>다음은 <b>STAGE ${si + 2} · ${next.name}</b>입니다. 적이 더 단단하고 빨라집니다. 현재 레벨 Lv.${hero.lvl}로 이어갑니다.</p>`}
    <div class="stats"><div><b>${fmtTime(G.time)}</b>클리어 시간</div><div><b>${G.maxCombo}</b>최대 콤보</div><div><b>${G.dmgTaken.toLocaleString()}</b>받은 피해</div></div>
    <div class="row">${last ? '<button class="btn" id="home">타이틀로</button>' : `<button class="btn" id="go">다음 스테이지 ▶</button><button class="btn ghost" id="home">타이틀</button>`}</div>`;
  ui.hidden = false;
  const go = document.getElementById('go'); if (go) go.onclick = () => startStage(si + 1, cls, hero.lvl, hero.exp);
  document.getElementById('home').onclick = showTitle;
}

// ---------- loop ----------
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.033, (t - last) / 1000); last = t;
  update(dt); render();
  requestAnimationFrame(frame);
}
showTitle();
(document.fonts && document.fonts.load ? Promise.all([document.fonts.load(`40px "Black Han Sans"`), document.fonts.load(`14px "Noto Sans KR"`)]).catch(() => {}) : Promise.resolve())
  .finally(() => requestAnimationFrame(frame));
})();
</script>

</body>
